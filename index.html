<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Stickman Idle RPG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>Stickman Idle RPG</header>

<div id="hud">
  <div id="hp">HP: 5000</div>
  <div id="gold">Gold: 100000</div>
  <div id="level">Lvl: 50</div>
</div>

<div id="game-container">
  <canvas id="game" width="400" height="200"></canvas>

  <div id="controls">
    <button id="btn-locations">Локации</button>
    <button id="btn-inventory">Инвентарь</button>
    <button id="btn-shop">Магазин</button>
  </div>

  <div id="location-selection" style="display:none; width: 100%; margin-top: 10px;">
    <!-- Кнопки локаций появятся сюда через JS -->
  </div>

  <pre id="log"></pre>
</div>

<script type="module">
import { startRun } from "./battle.js";
import { player } from "./game.js";
import { LOCATIONS } from "./data.js";

const hudHP = document.getElementById("hp");
const hudGold = document.getElementById("gold");
const hudLevel = document.getElementById("level");
const logEl = document.getElementById("log");
const locationDiv = document.getElementById("location-selection");

// HUD
function updateHUD() {
  hudHP.textContent = `HP: ${player.currentHp}`;
  hudGold.textContent = `Gold: ${player.gold}`;
  hudLevel.textContent = `Lvl: ${player.level}`;
}
setInterval(updateHUD, 500);

// Кнопка Локации
document.getElementById("btn-locations").onclick = () => {
  locationDiv.innerHTML = ""; // очистка
  locationDiv.style.display = "flex";
  locationDiv.style.flexDirection = "column";
  locationDiv.style.alignItems = "center";

  Object.keys(LOCATIONS).forEach(locId => {
    const loc = LOCATIONS[locId];
    const btn = document.createElement("button");
    btn.textContent = `${loc.name} (Ур: ${loc.level})`;
    btn.style.width = "80%";
    btn.style.margin = "5px 0";
    btn.onclick = () => {
      locationDiv.style.display = "none";
      logEl.textContent = `Вы выбрали: ${loc.name}\n`;
      startRun(locId);
    };
    locationDiv.appendChild(btn);
  });
};

// Инвентарь
document.getElementById("btn-inventory").onclick = () => {
  alert("Инвентарь пока пустой (заготовка)");
};

// Магазин
document.getElementById("btn-shop").onclick = () => {
  alert("Магазин пока пустой (заготовка)");
};
</script>

</body>
</html>
